services:

  #Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile

    container_name: frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      - VITE_API_URL=http://backend:5000/api

    depends_on:  
      - backend  

    networks:
      - app-network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    # env_file:
    #   - .env

    networks:
      - app-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - app-network


# Docker Network
networks:
  app-network:
    driver: bridge